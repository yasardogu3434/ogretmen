<style id="splcss">
#spl{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px;text-align:center;color:#13244A;background:radial-gradient(120% 80% at 50% 18%,#FFFFFF 0,#EAF1FC 52%,#D5E3F6 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,visibility .45s}
#spl.bit{opacity:0;visibility:hidden;pointer-events:none}
#spl .l3{position:relative;width:168px;height:168px;margin:0 auto 6px;animation:splN 2.8s ease-in-out infinite}
#spl .l3:before{content:"";position:absolute;left:6%;right:-4%;bottom:-14px;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(11,31,63,.55) 0%,rgba(11,31,63,.28) 45%,rgba(11,31,63,0) 72%);filter:blur(3px)}
#spl .l3:after{content:"";position:absolute;inset:2px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 40%);box-shadow:inset 1.5px 2px 2px rgba(255,255,255,.7),inset -2px -3px 4px rgba(11,31,63,.30)}
#spl .l3 img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(1px 2px 1px rgba(11,31,63,.55)) drop-shadow(4px 8px 7px rgba(11,31,63,.38)) drop-shadow(10px 18px 16px rgba(11,31,63,.22))}
#spl h1{margin:36px 0 0;font-size:24px;font-weight:650;letter-spacing:-.3px;color:#13244A}
#spl p{margin:8px 0 0;font-size:16px;color:#4A5A7C;min-height:22px}
#spl small{margin-top:26px;font-size:12.5px;letter-spacing:.3px;color:#7C8AA6}
#spl .dt{display:flex;gap:7px;margin-top:26px}
#spl .dt i{width:7px;height:7px;border-radius:50%;background:#C8932B;opacity:.25;animation:splB 1.1s ease-in-out infinite}
#spl .dt i:nth-child(2){animation-delay:.18s}#spl .dt i:nth-child(3){animation-delay:.36s}
@keyframes splB{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.18)}}
@keyframes splN{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media(prefers-color-scheme:dark){#spl{color:#fff;background:radial-gradient(120% 80% at 50% 25%,#1E3563 0,#13244A 55%,#0B1429 100%)}#spl h1{color:#fff}#spl p{color:#C9D3EA}#spl small{color:#8E9CBA}}
@media(prefers-reduced-motion:reduce){#spl .l3,#spl .dt i{animation:none}#spl .dt i{opacity:.7}}
</style>
